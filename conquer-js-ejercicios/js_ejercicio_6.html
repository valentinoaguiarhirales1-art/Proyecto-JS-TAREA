<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

      <section class="exercise-panel">
        <p class="eyebrow">Eventos · Temporización</p>
        <h1>Temporizador</h1>
        <p class="exercise-description">Inicia el cronómetro, haz una pausa y retómalo sin perder el tiempo acumulado.</p>
        <p class="timer-display" id="timer-display" role="timer" aria-label="Tiempo transcurrido">00:00:00</p>
        <div class="button-row timer-controls">
          <button class="button" id="start-timer" type="button">Iniciar</button>
          <button class="button button-secondary" id="pause-timer" type="button" disabled>Pausar</button>
          <button class="button button-danger" id="reset-timer" type="button">Reiniciar</button>
        </div>
      </section>
