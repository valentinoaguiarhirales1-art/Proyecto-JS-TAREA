<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>04 · Filtro en tiempo real · Conquer JS</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="js_ejercicio4.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html"><span class="brand-mark">CJ</span><span>Conquer <span class="brand-light">JS</span></span></a>
      <span class="header-note">Ejercicio 04 / 09</span>
    </header>
    <main class="page-shell">
      <a class="back-link" href="index.html"><span aria-hidden="true">←</span> Volver al índice</a>
      <section class="exercise-panel">
        <p class="eyebrow">Eventos · Búsqueda en vivo</p>
        <h1>Filtro de búsqueda</h1>
        <p class="exercise-description">Escribe para mostrar solo los elementos que coinciden con tu búsqueda.</p>
        <div class="field">
          <label for="search-input">Buscar en la lista</label>
          <input class="text-input" id="search-input" type="search" placeholder="Prueba con «ga»" autocomplete="off" />
        </div>
        <ul class="item-list filter-list" id="animal-list" aria-label="Animales">
          <li class="list-item" data-filter-item>Perro</li>
          <li class="list-item" data-filter-item>Gato</li>
          <li class="list-item" data-filter-item>Pez</li>
        </ul>
        <p class="status" id="filter-status" aria-live="polite"></p>
      </section>
    </main>
    <footer class="site-footer"><p>Conquer JS <span aria-hidden="true">·</span> Ejercicio 04</p></footer>
  </body>
</html>
