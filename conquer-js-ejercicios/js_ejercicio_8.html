<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>08 · Contador de palabras y caracteres · Conquer JS</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="js_ejercicio8.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html"><span class="brand-mark">CJ</span><span>Conquer <span class="brand-light">JS</span></span></a>
      <span class="header-note">Ejercicio 08 / 09</span>
    </header>
    <main class="page-shell">
      <a class="back-link" href="index.html"><span aria-hidden="true">←</span> Volver al índice</a>
      <section class="exercise-panel">
        <p class="eyebrow">Eventos · Texto en tiempo real</p>
        <h1>Contador de texto</h1>
        <p class="exercise-description">Escribe un párrafo para ver cuántas palabras y caracteres tiene.</p>
        <div class="field">
          <label for="paragraph-input">Tu párrafo</label>
          <textarea class="text-area" id="paragraph-input" placeholder="Empieza a escribir aquí..."></textarea>
        </div>
        <div class="button-row" aria-live="polite">
          <p class="result" id="word-count">Palabras: 0</p>
          <p class="result" id="character-count">Caracteres: 0</p>
        </div>
        <p class="helper">Los espacios y saltos de línea no se incluyen en el total de caracteres.</p>
      </section>
    </main>
    <footer class="site-footer"><p>Conquer JS <span aria-hidden="true">·</span> Ejercicio 08</p></footer>
  </body>
</html>
